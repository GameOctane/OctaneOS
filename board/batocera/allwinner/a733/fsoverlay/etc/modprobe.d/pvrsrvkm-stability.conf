# pvrsrvkm (PowerVR BXM-4-64) stability fix for A733.
#
# DisableDMOverlap: prevents GPU vertex and fragment data masters from running
# concurrently. With overlap enabled, both DMs compete for GPU memory bandwidth
# during heavy workloads (labwc compositing + ES thumbnail uploads during
# scraping), which deadlocks pvrsrvkm in-kernel and hard-hangs the system.
# Serialising DM submissions costs a small amount of throughput that is
# irrelevant for a compositor+frontend workload.
#
# EnableSoftResetContextSwitch: allows pvrsrvkm to recover from a stuck context
# switch via soft reset rather than hanging indefinitely.
options pvrsrvkm DisableDMOverlap=Y EnableSoftResetContextSwitch=Y
